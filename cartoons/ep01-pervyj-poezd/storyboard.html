<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Раскадровка: Первый поезд</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#2a2420;--mut:#7a6e62;--line:#d9cfc0;--acc:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1815;--card:#26221e;--ink:#efe7dc;--mut:#a89c8e;--line:#3a332c;--acc:#e3604f}}
:root[data-theme=dark]{--bg:#1b1815;--card:#26221e;--ink:#efe7dc;--mut:#a89c8e;--line:#3a332c;--acc:#e3604f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:24px 16px 8px;max-width:1280px;margin:auto}h1{margin:0;font-size:26px}header p{margin:4px 0 0;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:13px;color:var(--mut)}.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
section{max-width:1280px;margin:auto;padding:8px 16px}h2{font-size:17px;margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card svg{display:block;width:100%;height:auto;background:#fff}
.meta{padding:8px 10px 10px}.n{font-weight:700;color:var(--acc)}.t{color:var(--mut);font-size:12px;margin-left:6px}
.d{font-size:13px;margin-top:3px}.c{font-size:12px;color:var(--mut);margin-top:3px}
footer{max-width:1280px;margin:auto;padding:24px 16px 40px;color:var(--mut);font-size:13px}
</style></head><body>
<header><h1>Серия 1 · «Как появился первый поезд?»</h1>
<p>Эскизы композиции, 16:9 · 29 кадров · ~6:20. Не финальный рисунок, а схема: кто где стоит, какой план и куда движется камера.</p>
<div class="legend"><span><i style="background:#e8c48a"></i>Бублик</span><span><i style="background:#6a9a4a"></i>Тим</span><span><i style="background:#8a5a3a"></i>Профессор</span><span><i style="background:#c0392b"></i>Пыхтик</span><span>➜ движение камеры</span></div></header>
<main id="m"></main>
<footer>Правки: «кадр № + что поменять». После «да» — этап 3, настоящие кадры по промптам.</footer>
<script>
const S=[
["Сцена 1 · Загадка времени",[
[1,"0:00–0:04","museum dark",["puhEyes"],"close","zoomin","Хук: в темноте вспыхивают глаза Пыхтика, гудок, пар","«Ту-туу!»"],
[2,"0:04–0:14","museum",["T","B","model"],"medium","zoomin","Тим разглядывает модель паровоза, рядом Бублик","Б: «Кто придумал поезд?» Т: «Умный инженер!»"],
[3,"0:14–0:24","museum",["T","B","P"],"medium","pan","Входит Профессор со свитком","П: «История началась задолго до паровоза»"],
[4,"0:24–0:36","museum",["Puh","T","B","P"],"wide","pullback","Модель оживает и вырастает","Пыхтик: «Кто хочет в прошлое?»"],
[5,"0:36–0:50","cab",["B","T","P"],"medium","none","Герои в кабине, Бублик пристёгивается","Б: «Пристегните ремни!» → туннель 2026→1700"]]],
["Сцена 2 · Мир до поездов",[
[6,"0:50–1:00","mine",[],"wide","pan","Угольная шахта, серое небо","Титр «Англия, XVIII век»"],
[7,"1:00–1:15","mine",["miner","cart","T"],"medium","none","Шахтёры толкают вагонетки по деревянным рельсам","Т: «Как же перевозили уголь?»"],
[8,"1:15–1:30","mine",["horse","cart","cart2"],"medium","track","Лошадь тянет вереницу вагонеток","П: «Толкали люди, тянули лошади»"],
[9,"1:30–1:45","mine",["B","horse"],"close","none","Бублик гладит уставшую лошадь","Б: «Бедные лошадки!» → облако пара"]]],
["Сцена 3 · Сила пара",[
[10,"1:45–1:55","workshop",["beam"],"wide","zoomin","Мастерская, качается паровая машина","Титр «Шотландия, 1770-е»"],
[11,"1:55–2:10","workshop",["kettle"],"close","none","Кипит чайник, прыгает крышка","П: «Пар — это сила!»"],
[12,"2:10–2:25","workshop",["eng","beam","P"],"medium","none","Инженер в камзоле настраивает машину","П: «Уатт сделал машину мощнее»"],
[13,"2:25–2:40","workshop",["T","P"],"medium","zoomin","Тим поворачивается к Профессору","Т: «Поставить на колёса?» → шестерёнка-колесо"]]],
["Сцена 4 · Первый паровоз",[
[14,"2:40–2:50","factory",["crowd"],"wide","pan","Завод, утро, толпа","Титр «Уэльс, 1804 год»"],
[15,"2:50–3:05","factory",["trev","cart"],"wide","track","Паровоз Тревитика с маховиком тянет вагоны","Пыхтик: «Мой прапрапрадедушка!»"],
[16,"3:05–3:20","factory",["B","trev"],"medium","track","Бублик бежит рядом, уши развеваются","Б: «Он правда едет!»"],
[17,"3:20–3:40","factory",["T","P","rails"],"medium","none","Тим и Профессор у путей","П: «Один из первых… рельсы ломались!» → газета «1825»"]]],
["Сцена 5 · Железная дорога меняет мир",[
[18,"3:40–3:50","fest",["crowd"],"wide","crane","Праздник, флаги, оркестр (вид сверху)","Титр «Англия, 1825 год»"],
[19,"3:50–4:05","fest",["loco","cart","cart2"],"wide","none","«Локомоушн» трогается с вагонами","П: «Стоктон — Дарлингтон»"],
[20,"4:05–4:20","wagon",["T","P","pax"],"medium","none","Герои в вагоне среди пассажиров","Т: «Города становятся ближе!»"],
[21,"4:20–4:35","wagon",["B"],"close","pan","Бублик высунулся из вагона, ветер","Б: «Путешествовать интереснее!»"]]],
["Сцена 6 · «Ракета»",[
[22,"4:35–4:45","race",["rocket","loco"],"wide","pan","Трибуны, паровозы на старте","Титр «Рейнхилл, 1829 год»"],
[23,"4:45–5:00","race",["rocket"],"close","track","«Ракета»: жёлтая, высокая белая труба","Пыхтик: «Вот она — „Ракета“!»"],
[24,"5:00–5:15","race",["rocket","loco"],"low","track","Гонка: «Ракета» обгоняет соперников","Т: «Ничего себе!» П: «Почти 50 км/ч»"],
[25,"5:15–5:35","race",["rocket","crowd"],"wide","none","Финиш, толпа ликует","П: «Образец на много лет» → туннель"]]],
["Сцена 7 · Возвращение",[
[26,"5:35–5:45","tunnel",["loco","modern"],"wide","zoomin","Туннель времени: паровозы → скоростной поезд","—"],
[27,"5:45–6:00","museum",["T","B","P"],"medium","none","Снова музей","Т: «Поезд создавали поколения!»"],
[28,"6:00–6:10","museum",["P"],"close","none","Профессор кивает","П: «Каждое изобретение — ступенька»"],
[29,"6:10–6:20","museum",["model","B","pyramid"],"medium","zoomin","Пыхтик подмигивает, на стене тень пирамиды","Б: «Куда дальше?» → тизер серии 2"]]]
];
const BG={museum:["#efe2c8","#c9b48f"],"museum dark":["#2a2430","#1a1620"],cab:["#5a3a2a","#3a2418"],mine:["#b9bcc0","#6d6256"],workshop:["#d9b48a","#8a5a3a"],factory:["#f2d7b0","#7c7368"],fest:["#bfe0f0","#7aa35a"],wagon:["#cfe6f3","#8fae6a"],race:["#cbe4f4","#9bb873"],tunnel:["#3b2b6b","#120c2a"]};
function bg(t){const[a,b]=BG[t];let s=`<rect width="320" height="120" fill="${a}"/><rect y="120" width="320" height="60" fill="${b}"/>`;
if(t.startsWith("museum")){for(let i=0;i<3;i++)s+=`<rect x="${30+i*100}" y="25" width="60" height="40" fill="none" stroke="#8a7656" stroke-width="2"/>`;}
if(t=="mine")s+=`<path d="M0 120 L60 70 L120 120 Z M200 120 L260 60 L320 120Z" fill="#4a4038"/><rect x="140" y="60" width="40" height="60" fill="#3a302a"/><path d="M135 60h50l-25-20z" fill="#5a4a3a"/>`;
if(t=="workshop")for(let x=0;x<320;x+=40)for(let y=0;y<120;y+=20)s+=`<rect x="${x+(y%40?20:0)}" y="${y}" width="38" height="18" fill="none" stroke="#b98d63"/>`;
if(t=="factory")s+=`<rect x="20" y="40" width="18" height="80" fill="#6b5f55"/><rect x="60" y="55" width="18" height="65" fill="#6b5f55"/><circle cx="30" cy="30" r="12" fill="#ccc"/><circle cx="45" cy="18" r="10" fill="#ddd"/><rect x="230" y="70" width="80" height="50" fill="#8a7a6a"/>`;
if(t=="fest"||t=="race"){for(let x=0;x<320;x+=22)s+=`<path d="M${x} 20 l11 14 l11 -14" fill="${x%44?'#e74c3c':'#f1c40f'}"/>`;s+=`<line x1="0" y1="20" x2="320" y2="20" stroke="#555"/>`}
if(t=="race")s+=`<rect x="0" y="70" width="320" height="30" fill="#8a7a6a"/>`+Array.from({length:16},(_,i)=>`<circle cx="${10+i*20}" cy="68" r="6" fill="#6d5d4d"/>`).join("");
if(t=="wagon")s+=`<rect x="0" y="0" width="320" height="180" fill="none" stroke="#6b4a2a" stroke-width="18"/><line x1="0" y1="140" x2="320" y2="140" stroke="#6b4a2a" stroke-width="6"/>`;
if(t=="cab")s+=`<circle cx="160" cy="60" r="30" fill="#f39c12" opacity=".5"/><rect x="40" y="10" width="240" height="8" fill="#2a1a10"/>`;
if(t=="tunnel")for(let r=150;r>10;r-=22)s+=`<circle cx="160" cy="90" r="${r}" fill="none" stroke="#a78bfa" stroke-width="3" opacity="${r/170}"/>`;
if(["mine","factory","fest","race"].includes(t))s+=`<line x1="0" y1="150" x2="320" y2="150" stroke="#3a2a1a" stroke-width="3"/><line x1="0" y1="160" x2="320" y2="160" stroke="#3a2a1a" stroke-width="3"/>`;
return s}
const C={
B:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-12" y="-20" width="24" height="30" rx="6" fill="#d8c79a"/><circle cx="0" cy="-32" r="14" fill="#f4ead2"/><ellipse cx="-13" cy="-28" rx="5" ry="10" fill="#c98a4a"/><ellipse cx="13" cy="-28" rx="5" ry="10" fill="#f4ead2" stroke="#c9b48f"/><circle cx="-5" cy="-34" r="4" fill="none" stroke="#222"/><circle cx="5" cy="-34" r="4" fill="none" stroke="#222"/><ellipse cx="0" cy="-26" rx="3" ry="2" fill="#222"/><path d="M-16 -44 h32 l-4 -8 h-24z" fill="#a0773f"/><path d="M-10 -20 h20 l-10 7z" fill="#d9342b"/></g>`,
T:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-11" y="-22" width="22" height="22" rx="4" fill="#6a9a4a"/><rect x="-10" y="0" width="20" height="14" fill="#b8a36a"/><circle cx="0" cy="-34" r="12" fill="#f0c8a0"/><path d="M-18 -42 h36 l-6 -8 h-24z" fill="#c99a4a"/><rect x="-5" y="-16" width="10" height="7" fill="#333"/></g>`,
P:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-14" y="-26" width="28" height="40" rx="5" fill="#8a5a3a"/><circle cx="0" cy="-38" r="13" fill="#f0c8a0"/><circle cx="0" cy="-46" r="14" fill="#eee" opacity=".9"/><circle cx="0" cy="-37" r="12" fill="#f0c8a0"/><circle cx="-5" cy="-39" r="4" fill="none" stroke="#222"/><circle cx="5" cy="-39" r="4" fill="none" stroke="#222"/><path d="M-6 -31 q6 4 12 0" stroke="#fff" stroke-width="3" fill="none"/><path d="M-5 -24 l5 3 l5 -3 v6 l-5 -3 l-5 3z" fill="#c0392b"/><rect x="14" y="-14" width="6" height="18" fill="#e9d29a"/></g>`,
Puh:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-40" y="-30" width="55" height="30" fill="#c0392b"/><rect x="15" y="-48" width="28" height="48" fill="#a93226"/><rect x="-30" y="-48" width="10" height="18" fill="#f1c40f"/><circle cx="-40" cy="-15" r="14" fill="#c0392b" stroke="#f1c40f" stroke-width="3"/><circle cx="-45" cy="-18" r="4" fill="#3498db"/><circle cx="-36" cy="-18" r="4" fill="#3498db"/><path d="M-46 -9 q6 5 12 0" stroke="#222" fill="none"/><circle cx="-20" cy="2" r="8" fill="#222"/><circle cx="5" cy="2" r="8" fill="#222"/><circle cx="30" cy="2" r="8" fill="#222"/></g>`,
puhEyes:()=>`<ellipse cx="120" cy="90" rx="26" ry="30" fill="#fff"/><ellipse cx="200" cy="90" rx="26" ry="30" fill="#fff"/><circle cx="125" cy="95" r="13" fill="#3498db"/><circle cx="195" cy="95" r="13" fill="#3498db"/><circle cx="60" cy="40" r="30" fill="#ddd" opacity=".5"/><circle cx="270" cy="50" r="35" fill="#ddd" opacity=".5"/>`,
model:(x,y,k)=>C.Puh(x,y,k*.45),
miner:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-10" y="-22" width="20" height="30" fill="#5a4a3a"/><circle cx="0" cy="-30" r="9" fill="#c9a080"/><line x1="10" y1="-10" x2="26" y2="-4" stroke="#5a4a3a" stroke-width="5"/></g>`,
cart:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-22 -24 h44 l-6 22 h-32z" fill="#8a5a2a"/><path d="M-18 -24 q18 -14 36 0" fill="#222"/><circle cx="-10" cy="2" r="6" fill="#333"/><circle cx="10" cy="2" r="6" fill="#333"/></g>`,
cart2:(x,y,k)=>C.cart(x,y,k),
horse:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><ellipse cx="0" cy="-22" rx="26" ry="13" fill="#9a5a2a"/><rect x="18" y="-50" width="12" height="28" fill="#9a5a2a" transform="rotate(20 24 -36)"/><ellipse cx="34" cy="-50" rx="12" ry="8" fill="#9a5a2a"/><circle cx="36" cy="-53" r="2" fill="#222"/>${[-18,-8,8,18].map(a=>`<rect x="${a}" y="-12" width="5" height="16" fill="#7a4a1a"/>`).join("")}</g>`,
beam:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-10" y="-90" width="20" height="90" fill="#5a3a22"/><rect x="-70" y="-96" width="140" height="10" fill="#333" transform="rotate(-8)"/><rect x="40" y="-60" width="34" height="60" rx="8" fill="#7a7a7a"/></g>`,
kettle:()=>`<ellipse cx="160" cy="125" rx="60" ry="40" fill="#555"/><rect x="130" y="80" width="60" height="10" fill="#666" transform="rotate(-12 160 85)"/><path d="M215 115 l40 -25" stroke="#555" stroke-width="12"/><circle cx="200" cy="50" r="18" fill="#eee" opacity=".7"/><circle cx="230" cy="35" r="14" fill="#eee" opacity=".6"/><text x="120" y="70" font-size="14" fill="#333">⇡ ⇡</text>`,
eng:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-13" y="-26" width="26" height="40" fill="#3a4a7a"/><circle cx="0" cy="-37" r="11" fill="#f0c8a0"/><path d="M-11 -42 q11 -10 22 0 v6 h-22z" fill="#ddd"/></g>`,
trev:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-50" y="-36" width="80" height="30" rx="14" fill="#4a4a4a"/><rect x="-44" y="-70" width="8" height="34" fill="#333"/><circle cx="34" cy="-30" r="22" fill="none" stroke="#222" stroke-width="5"/><circle cx="-30" cy="0" r="10" fill="#222"/><circle cx="10" cy="0" r="10" fill="#222"/><circle cx="-40" cy="-80" r="10" fill="#ccc"/></g>`,
loco:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-40" y="-34" width="60" height="28" rx="12" fill="#2e5d3a"/><rect x="-36" y="-64" width="8" height="30" fill="#222"/><rect x="20" y="-44" width="22" height="38" fill="#7a5a3a"/><circle cx="-24" cy="0" r="10" fill="#222"/><circle cx="8" cy="0" r="10" fill="#222"/></g>`,
rocket:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-36" y="-34" width="56" height="26" rx="12" fill="#f1c40f"/><rect x="-34" y="-84" width="8" height="50" fill="#f5f5f5" stroke="#999"/><line x1="10" y1="-30" x2="30" y2="-4" stroke="#333" stroke-width="5"/><circle cx="-20" cy="0" r="14" fill="none" stroke="#333" stroke-width="4"/><circle cx="16" cy="2" r="9" fill="#333"/></g>`,
modern:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><path d="M-60 -24 h90 q30 0 40 20 v4 h-130z" fill="#eef" stroke="#3a4a9a" stroke-width="2"/><rect x="-55" y="-18" width="70" height="8" fill="#3a4a9a"/></g>`,
crowd:(x,y,k)=>Array.from({length:12},(_,i)=>`<g transform="translate(${20+i*25} ${y+((i%2)*6)})"><rect x="-7" y="-16" width="14" height="18" fill="${['#5a4a7a','#7a4a3a','#3a5a4a'][i%3]}"/><circle cx="0" cy="-22" r="6" fill="#e0b890"/></g>`).join(""),
pax:(x,y,k)=>`<g opacity=".6">${C.crowd(0,y,k)}</g>`,
rails:()=>`<g stroke="#5a4030" stroke-width="3"><line x1="0" y1="168" x2="320" y2="168"/>${Array.from({length:12},(_,i)=>`<line x1="${i*28}" y1="160" x2="${i*28+10}" y2="176"/>`).join("")}</g><path d="M210 166 l6 -6 l4 8" stroke="#c0392b" stroke-width="2" fill="none"/>`,
pyramid:()=>`<path d="M230 110 l40 -60 l40 60z" fill="#000" opacity=".25"/>`
};
const LAYOUT={wide:{k:.6,y:150},medium:{k:1,y:160},close:{k:1.9,y:205},low:{k:1.1,y:150}};
function cams(c){const a='stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#ar)"';
return {zoomin:`<path d="M20 20 L50 45" ${a}/><path d="M300 20 L270 45" ${a}/><path d="M20 160 L50 135" ${a}/><path d="M300 160 L270 135" ${a}/>`,
pullback:`<path d="M50 45 L20 20" ${a}/><path d="M270 45 L300 20" ${a}/><path d="M50 135 L20 160" ${a}/><path d="M270 135 L300 160" ${a}/>`,
pan:`<path d="M110 14 L210 14" ${a}/>`,track:`<path d="M60 14 L260 14" ${a}/><path d="M60 22 L260 22" ${a} opacity=".5"/>`,
crane:`<path d="M300 150 L300 40" ${a}/>`,none:""}[c]}
function frame(sh){const[n,t,b,chars,size,cam,d,c]=sh;const L=LAYOUT[size];let body="";
const solo=["puhEyes","kettle","rails","pyramid","crowd","pax"];const main=chars.filter(x=>!solo.includes(x));
const step=320/(main.length+1);
main.forEach((ch,i)=>{const big=["beam","trev","loco","rocket","modern","Puh"].includes(ch);let k=L.k*(big?1.1:1);let x=step*(i+1);if(size=="close"&&main.length==1)x=160;
body+=C[ch](x,L.y-(size=="close"?20:0),k)});
chars.filter(x=>solo.includes(x)).forEach(ch=>body+=C[ch](0,ch=="crowd"?118:150,1));
const sky=size=="low"?`<rect width="320" height="180" fill="none"/>`:"";
return `<div class="card"><svg viewBox="0 0 320 180" role="img" aria-label="Кадр ${n}"><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><clipPath id="cl${n}"><rect width="320" height="180"/></clipPath></defs><g clip-path="url(#cl${n})">${bg(b)}${body}${sky}</g>${cams(cam)}<rect x="4" y="152" width="52" height="22" rx="4" fill="#000" opacity=".6"/><text x="10" y="168" font-size="13" fill="#fff" font-family="system-ui">${n} · ${{wide:"общ",medium:"сред",close:"круп",low:"низк"}[size]}</text></svg><div class="meta"><span class="n">#${n}</span><span class="t">${t}</span><div class="d">${d}</div><div class="c">${c}</div></div></div>`}
document.getElementById("m").innerHTML=S.map(([h,list])=>`<section><h2>${h}</h2><div class="grid">${list.map(frame).join("")}</div></section>`).join("");
</script></body></html>
